name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"  # Trigger on version tags like v1.0.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    name: Build Windows EXE
    runs-on: windows-latest
    # IMPORTANT NOTE: sequential so both jobs don't race to create the same release
    needs: build-mac

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build EXE
        run: npx electron-builder --win --publish never

      # latest.yml + blockmap are what electron-updater reads to auto-update windows
      # IMPORTANT NOTE: electron-builder's own publish created a SECOND release on the same
      # tag in v1.0.3, so releases/latest had no .exe. Upload to the mac job's release instead.
      - name: Upload EXE to release
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-Item dist/*.exe, dist/*.exe.blockmap, dist/latest.yml) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}