<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subplacity</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', 'Comic Sans MS', 'Comic Sans', cursive;
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(0,0,0,0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,0,0,0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: clamp(56px, 15vw, 96px);
            font-weight: 700;
            color: #2c2c2c;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 12px;
            transform: rotate(-0.5deg);
            display: inline-block;
        }

        .subtitle {
            font-size: clamp(16px, 4vw, 22px);
            color: #8a7e6e;
            font-weight: 400;
            letter-spacing: -0.3px;
            margin-bottom: 80px;
            transform: rotate(0.3deg);
            position: relative;
        }

        .boxes {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 240px;
            height: 120px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            color: #2c2c2c;
            text-transform: lowercase;
            letter-spacing: 2px;
            transition: transform 0.15s ease;
        }

        .box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: transparent;
            border: 3px solid #2c2c2c;
            filter: url(#scribble);
        }

        .box::after {
            content: '';
            position: absolute;
            inset: -3px;
            background: transparent;
            border: 2px dashed #bcb0a0;
            filter: url(#scribble);
            opacity: 0.6;
        }

        .box:nth-child(1) {
            transform: rotate(-1.2deg) translateY(0);
        }

        .box:nth-child(1):hover {
            transform: rotate(-1.2deg) translateY(-6px);
            border-color: #555;
        }

        .box:nth-child(2) {
            transform: rotate(1.5deg) translateY(0);
        }

        .box:nth-child(2):hover {
            transform: rotate(1.5deg) translateY(-6px);
            border-color: #555;
        }

        .box span {
            position: relative;
            z-index: 1;
            filter: url(#scribble-text);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .box:hover span {
            transform: scale(1.06);
        }

        .box:active {
            transform: scale(0.96);
            transition-duration: 0.05s;
        }

        .box::before,
        .box::after {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .box:hover::before {
            border-color: #000;
            background: rgba(44, 44, 44, 0.03);
        }

        .box:hover::after {
            border-color: #8a7e6e;
            opacity: 0.8;
        }

        .scribble-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.6;
            mix-blend-mode: multiply;
        }

        @media (max-width: 560px) {
            .boxes {
                flex-direction: column;
                align-items: center;
            }
            .box {
                width: 200px;
                height: 150px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <svg style="position:absolute;width:0;height:0;" aria-hidden="true">
        <filter id="scribble">
            <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" seed="2"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="scribble-text">
            <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" result="noise" seed="7"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>

    <div class="container">
        <div class="title">subplacity</div>
        <div class="subtitle">join any roblox subplace</div>
        <div class="boxes">
            <a href="https://github.com/jesodium/subplacity/releases" class="box" target="_blank" id="download-link">
                <span id="download-text">download</span>
            </a>
            <a href="https://github.com/jesodium/subplacity" class="box" target="_blank">
                <span>source code</span>
            </a>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'jesodium';
        const GITHUB_REPO = 'subplacity';

        function getOS() {
            const ua = navigator.userAgent;
            if (ua.includes('Win')) return 'windows';
            if (ua.includes('Mac')) return 'macos';
            if (ua.includes('Linux')) return 'linux';
            return '';
        }

        async function updateDownload() {
            const link = document.getElementById('download-link');
            const text = document.getElementById('download-text');

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases/latest`);
                const data = await res.json();

                const os = getOS();
                let asset = data.assets?.[0];

                if (os === 'windows') asset = data.assets.find(a => a.name.match(/\.(exe|msi|nupkg)$/i)) || asset;
                else if (os === 'macos') asset = data.assets.find(a => a.name.match(/\.(dmg|zip)$/i)) || asset;
                else if (os === 'linux') asset = data.assets.find(a => a.name.match(/\.(AppImage|deb|rpm)$/i)) || asset;

                if (asset) {
                    link.href = asset.browser_download_url;
                    text.textContent = os ? `download for ${os}` : 'download';
                } else {
                    text.textContent = 'download';
                }
            } catch {
                text.textContent = 'download';
            }
        }

        updateDownload();
    </script>
</body>
</html>
